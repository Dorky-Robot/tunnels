# What scripts/mesh-watch.py cannot derive from the fleet file and
# mesh/machines. One rule per line; whole-line comments only.
#
#   skip   <host or machine>  <why>     do not check it; the reason is shown
#   extra  <url>              <what>    a page no route covers: a site off the
#                                       tunnels, or a second page on a routed
#                                       host (filed under its machine)
#   expect <host or url>      <text>    the page must contain this text; an
#                                       expect keyed by an extra's exact url
#                                       wins over its host's
#
# A skip is a claim that something is down on purpose. Give the reason, and
# take the line out when it stops being true.

skip   sara                            Sara's laptop sleeps; unreachable usually means shut
skip   sipag.homesforsalebymonica.com  being retired (kapwa f6b09); answers 503 "dashboard not configured" meanwhile

extra  https://www.homesforsalebymonica.com/  Monica's public site, served outside the tunnels
extra  https://everyday.vet/                  the practice's public site, served outside the tunnels
# The desk's /health says ok only when the kita store opens; the page check
# above it cannot tell, since a lock or sign-in page still says Everyday Vet.
extra  https://admin.everyday.vet/health      the kita store opens behind the desk
extra  https://office.everyday.vet/health     the kita store opens behind the desk
extra  https://sara.everyday.vet/health       the kita store opens behind the desk

expect admin.everyday.vet               Everyday Vet
expect office.everyday.vet              Everyday Vet
expect sara.everyday.vet                Everyday Vet
expect https://admin.everyday.vet/health   "ok":true
expect https://office.everyday.vet/health  "ok":true
expect https://sara.everyday.vet/health    "ok":true
expect admin.homesforsalebymonica.com   Monica
expect monica.homesforsalebymonica.com  Monica
expect www.homesforsalebymonica.com     Monica
expect doug.homesforsalebymonica.com    coming soon
# Pocket ID's own page; drive. redirects to Pocket ID's sign-in, so the same
# text there proves Nextcloud answered and handed off to id.
expect id.homesforsalebymonica.com      application-images
expect drive.homesforsalebymonica.com   application-images
expect kapwa.felixflor.es               kapwa
expect media.felixflor.es               Immich
expect vet.felixflor.es                 Immich

# The leads on dorkyrobot2, for scripts/lead-keeper.py. It keeps each lead,
# and every worker named "<lead> · <task>", alive and on Remote Control for
# as long as `claude agents --all` lists it. `claude rm` is how a session is
# finished on purpose; a removed session is never brought back.
#
# One lead per line, fields split by " | ":
#
#   <name> | <cwd> | <note>
#
# name  exactly as `claude agents` shows it. Only an exact match, or the
#       name followed by " · ", counts: "Meshy" is not Mesh's.
# cwd   where the lead starts from, and where a worker starts when its own
#       cwd is gone. It must be a folder Claude trusts, or the session
#       refuses to start. ~ is fine.
# note  optional: the prompt the lead wakes to after it died. Without one it
#       is told to check its ledger and workers and SendMessage CTO
#       "<name> back". Workers are told to SendMessage their lead.
#
#   exclude | <name or glob>   sessions of ours to leave alone. A glob
#                              matches the whole name or the task after
#                              " · ": "exclude | scratch*" skips "Mesh · scratch 2".
#
# Test sessions ("lk-throwaway*", "claude-update probe") are always left
# alone, config or not.
#
# Take a lead out when it is retired on purpose.

CTO           | ~/Projects | You were restarted by lead-keeper after your process died. Check your ledger and the other leads with `claude agents`, then carry on.
Mesh          | ~/Projects
Everyday Vet  | ~/Projects/dorky_robot/dev/everyday-vet-admin
Agent tooling | ~/Projects
DorkyRobot    | ~/Projects
Monica        | ~/Projects

# The lead sessions on dorkyrobot2 that must stay up, for scripts/lead-keeper.py.
# One per line, fields split by " | ":
#
#   <name> | <cwd> | <note>
#
# name  exactly as `claude agents` shows it; only an exact match is a lead,
#       so "Monica · daily briefs site" is never mistaken for "Monica".
# cwd   the folder the session must start from. ~ is fine. It must be a
#       folder Claude trusts, or the session refuses to start.
# note  optional: the prompt the lead wakes up to. Without one it is told it
#       was restarted by lead-keeper, to check its ledger and workers, and to
#       SendMessage CTO "<name> back".
#
# Take a lead out when it is retired on purpose, or lead-keeper will bring
# it back every five minutes.

CTO           | ~/Projects | You were restarted by lead-keeper after your process died. Check your ledger and the other leads with `claude agents`, then carry on.
Mesh          | ~/Projects
Everyday Vet  | ~/Projects/dorky_robot/dev/everyday-vet-admin
Agent tooling | ~/Projects
DorkyRobot    | ~/Projects
Monica        | ~/Projects

# ── dorkyrobot1 ──
# Two paths, not three: this box serves nothing yet, so it has no cloudflared
# tunnel and no ssh hostname. Add `cloudflare-dorkyrobot1` the day it does —
# until then a Host block pointing at a name that does not resolve is a trap.
Host dorkyrobot1
  HostName dorkyrobot1
  ProxyCommand none
  User felixflores
  IdentityFile ~/.ssh/id_mesh_ed25519
  IdentitiesOnly yes
  UserKnownHostsFile ~/.ssh/config.d/mesh_known_hosts ~/.ssh/known_hosts

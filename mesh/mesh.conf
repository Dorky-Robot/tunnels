# ── dorkyrobot1 ──
# Its tunnel lives in the dorkyrobot account while ssh-dorkyrobot1.felixflor.es
# lives in the gmail one, so `tunnels route add` could write the ingress but not
# the DNS ("no Cloudflare zone found"). The CNAME was already there by hand and
# the path works; if it is ever rebuilt, the record has to be made where the
# zone is, not where the tunnel is.
Host dorkyrobot1 dr1 dorkyrobot1
  HostName dorkyrobot1
  ProxyCommand none
  User felixflores
  IdentityFile ~/.ssh/id_mesh_ed25519
  IdentitiesOnly yes
  UserKnownHostsFile ~/.ssh/config.d/mesh_known_hosts ~/.ssh/known_hosts
Host dorkyrobot1-lan dorkyrobot1.local
  HostName dorkyrobot1.local
  ProxyCommand none
  User felixflores
  IdentityFile ~/.ssh/id_mesh_ed25519
  IdentitiesOnly yes
  UserKnownHostsFile ~/.ssh/config.d/mesh_known_hosts ~/.ssh/known_hosts
Host cloudflare-dorkyrobot1
  HostName ssh-dorkyrobot1.felixflor.es
  User felixflores
  ProxyCommand /usr/bin/env PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin cloudflared access ssh --hostname %h
  IdentityFile ~/.ssh/id_mesh_ed25519
  IdentitiesOnly yes
  UserKnownHostsFile ~/.ssh/config.d/mesh_known_hosts ~/.ssh/known_hosts


# ── dorkyrobot2 ──
# Note the user: this box's account is `dorkyrobot2`, not felixflores.
# Its tunnel (DorkyRobot2) and ssh-dorkyrobot2.felixflor.es are in the same
# Cloudflare account, so `tunnels route add` could write both ingress and DNS.
Host dorkyrobot2 dr2 dorkyrobot2
  HostName dorkyrobot2
  ProxyCommand none
  User dorkyrobot2
  IdentityFile ~/.ssh/id_mesh_ed25519
  IdentitiesOnly yes
  UserKnownHostsFile ~/.ssh/config.d/mesh_known_hosts ~/.ssh/known_hosts

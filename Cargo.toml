[package]
license = "MIT OR Apache-2.0"
name = "tunnels"
version = "0.21.4"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
libc = "0.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
ureq = { version = "3.4.2", features = ["json"] }
toml = "1.1.6"
tiny_http = "0.12.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
sha2 = "0.11.0"

[dev-dependencies]
base64 = "0.22.1"
serde_json = "1.0.149"
tempfile = "3"
tiny_http = "0.12.0"

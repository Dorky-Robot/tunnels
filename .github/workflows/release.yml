name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            arch: x86_64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      # Sign and notarize before packaging, so the tarball, and the sha256 the
      # formula pins, are of the signed binary. Without a Developer ID
      # signature every brew upgrade looks like a new app to the macOS
      # firewall, which then drops tailnet traffic to the agent (README,
      # Releases). No secrets means the job fails: never ship unsigned again.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: sh scripts/release/keychain.sh setup
      - name: Sign
        run: sh scripts/release/sign.sh target/${{ matrix.target }}/release/tunnels ${{ matrix.arch }}
      - name: Notarize
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: sh scripts/release/notarize.sh target/${{ matrix.target }}/release/tunnels
      - name: Remove signing keychain
        if: always()
        run: sh scripts/release/keychain.sh cleanup

      - name: Package
        run: |
          tarball=tunnels-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          tar czf "$tarball" -C target/${{ matrix.target }}/release tunnels
          # Check the copy we ship, not the one we signed.
          mkdir shipped && tar xzf "$tarball" -C shipped
          codesign --verify --strict --verbose=2 shipped/tunnels
          codesign -dvv shipped/tunnels 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier)='
      - uses: actions/upload-artifact@v4
        with:
          name: tunnels-${{ matrix.target }}
          path: tunnels-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: tunnels-*.tar.gz

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute SHA256 sums
        run: |
          for f in tunnels-*.tar.gz; do
            target=$(echo "$f" | sed "s/tunnels-${GITHUB_REF_NAME}-//" | sed 's/\.tar\.gz//' | tr '-' '_')
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            echo "SHA_${target}=${sha}" >> "$GITHUB_ENV"
          done

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: dorky-robot/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/Dorky-Robot/tunnels/releases/download/${TAG}"

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/tunnels.rb << FORMULA
          class Tunnels < Formula
            desc "Cloudflare tunnels across a fleet of Macs: a config file, a CLI and an agent"
            homepage "https://github.com/Dorky-Robot/tunnels"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "${BASE}/tunnels-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_aarch64_apple_darwin}"
              end

              on_intel do
                url "${BASE}/tunnels-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_x86_64_apple_darwin}"
              end
            end

            def install
              bin.install "tunnels"
            end

            test do
              assert_match "tunnels", shell_output("#{bin}/tunnels --help")
            end
          end
          FORMULA

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tunnels.rb
          git commit -m "tunnels ${VERSION}"
          git push

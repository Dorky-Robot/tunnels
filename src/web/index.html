<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tunnels</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --ink: #1d1d1b; --mute: #6b6b66; --line: #e4e3de;
    --up: #1f8f4e; --down: #c2412d; --warn: #b7791f; --info: #52627a; --accent: #2f5bd3;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1e1e1c; --ink: #ecebe6; --mute: #9a9993; --line: #33332f;
            --up: #3fbf74; --down: #ec6a55; --warn: #e0a642; --info: #8fa3c2; --accent: #7d9cf0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: baseline; padding: 16px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  header .meta { color: var(--mute); font-size: 13px; }
  header .spacer { flex: 1; }
  main { padding: 16px 24px 48px; max-width: 1200px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 28px 0 10px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; transform: translateY(-1px); }
  .up { background: var(--up); } .down { background: var(--down); } .unknown, .missing { background: var(--mute); }
  .alias { font-weight: 600; font-size: 15px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .mute { color: var(--mute); }
  .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
  .tag.bad { color: var(--down); border-color: var(--down); }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .tag.good { color: var(--up); border-color: var(--up); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  td { padding: 5px 8px 5px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
  td:first-child { width: 38%; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--down); border-color: var(--down); }
  button:disabled { opacity: .5; cursor: default; }
  .finding { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .finding:first-child { border-top: 0; }
  .finding .fix { grid-column: 2; font-family: var(--mono); font-size: 12px; color: var(--mute); }
  .lvl-error { color: var(--down); } .lvl-warn { color: var(--warn); } .lvl-info { color: var(--info); }
  .action { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .action:first-child { border-top: 0; }
  .events { font-family: var(--mono); font-size: 12px; max-height: 260px; overflow: auto; }
  .events div { padding: 2px 0; white-space: pre-wrap; }
  pre { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 10px; border-radius: 6px; overflow: auto; max-height: 420px; margin: 8px 0 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .peers { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .peers span { display: inline-flex; gap: 5px; align-items: center; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; max-width: 90vw; white-space: pre-wrap; z-index: 5; }
  .loading { color: var(--mute); padding: 40px 0; text-align: center; }
  details summary { cursor: pointer; color: var(--mute); }
</style>
</head>
<body>
<header>
  <h1>tunnels</h1>
  <span class="meta" id="meta">loading…</span>
  <span class="spacer"></span>
  <span class="tag" id="whoami"></span>
  <div class="peers" id="peers"></div>
  <button id="refresh">Refresh</button>
</header>
<main>
  <div id="app"><div class="loading">Looking at Cloudflare and this Mac…</div></div>
</main>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let state = null;
let me = { who: "tailnet", admin: true, via_cloudflare: false };
let tokMachine = null;

function toast(msg, ms = 4000) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", ms);
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Tunnels": "1" }, body: JSON.stringify(body || {}) });
  const v = await r.json();
  if (!r.ok) throw new Error(v.error || r.statusText);
  return v;
}

function reportText(r) {
  const lines = (r.done || []).map(o => `${o.ok ? "✓" : "✗"} ${o.summary} — ${o.detail}`);
  (r.held || []).forEach(([s, why]) => lines.push(`· held: ${s} (${why})`));
  return lines.join("\n") || "nothing to do";
}

async function whoami() {
  try { me = await (await fetch("/api/whoami")).json(); } catch { }
  const el = $("#whoami");
  el.innerHTML = me.via_cloudflare
    ? `${esc(me.who)} · ${me.admin ? "admin" : "can look, not change"} · <a href="/auth/logout">sign out</a>`
    : "on the tailnet · admin";
  el.className = "tag " + (me.admin ? "good" : "");
}

async function load(fresh) {
  $("#refresh").disabled = true;
  try {
    const r = await fetch("/api/status" + (fresh ? "?fresh=1" : ""));
    const v = await r.json();
    if (!r.ok) throw new Error(v.error || r.statusText);
    state = v; render();
  } catch (e) {
    $("#app").innerHTML = `<div class="card lvl-error">${esc(e.message)}</div>`;
  } finally { $("#refresh").disabled = false; }
  loadAgent(); loadPeers(); loadCfLog();
}

async function loadAgent() {
  try {
    const v = await (await fetch("/api/agent")).json();
    const el = $("#events"); if (!el) return;
    const tick = v.last_tick;
    $("#agent-meta").textContent = `agent v${v.version} on ${v.machine} · up since ${v.started_at}` +
      (tick ? ` · last pass ${tick.at} (${tick.took_ms} ms)` : "") + (tick && tick.error ? ` · ✗ ${tick.error}` : "");
    el.innerHTML = (v.events || []).map(e => `<div><span class="mute">${esc(e.at)}</span> ${esc(e.kind.padEnd(8))} ${esc(e.message)}</div>`).join("")
      || `<div class="mute">nothing yet — the agent has had nothing to fix</div>`;
  } catch { }
}

async function loadCfLog() {
  try {
    const v = await (await fetch("/api/cf-log?all=1")).json();
    const el = $("#cflog"); if (!el) return;
    el.innerHTML = v.length ? v.map(r => `<div><span class="mute">${esc(r.at)}</span> ${r.ok ? "✓" : "✗"} ${esc(r.machine)} ${esc(r.method)} ${esc(r.path)}` +
      `${r.undoes ? ` <span class="tag">undid ${esc(r.undoes)}</span>` : ""}${!r.ok ? ` <span class="tag">failed; nothing changed</span>` : r.undo ? "" : ` <span class="tag warn">not undoable</span>`} <span class="mute">${esc(r.id)}</span></div>`).join("")
      : `<div class="mute">No changes through <span class="mono">tunnels cf</span> yet.</div>`;
  } catch { }
}

async function loadPeers() {
  try {
    const v = await (await fetch("/api/peers")).json();
    v.forEach(p => { const el = document.querySelector(`[data-health="${CSS.escape(p.machine)}"]`);
      if (el) el.textContent = p.health ? `v${p.health.version} · serial ${p.health.serial} · last pass ${p.health.last_tick ? p.health.last_tick.at : "—"}` : "not answering"; });
    $("#peers").innerHTML = v.map(p => {
      const h = p.health; const ok = !!h;
      const title = ok ? `v${h.version} · fleet serial ${h.serial ?? "—"}` : "not answering";
      return `<span title="${esc(title)}"><i class="dot ${ok ? "up" : "down"}"></i>${esc(p.machine)}${ok && state && h.serial !== state.serial ? ` <span class="tag warn">serial ${esc(h.serial)}</span>` : ""}</span>`;
    }).join("");
  } catch { }
}

function dnsTag(r) {
  switch (r.dns) {
    case "ok": return `<span class="tag good">dns ok</span>`;
    case "missing": return `<span class="tag bad">no dns</span>`;
    case "elsewhere": return `<span class="tag warn">dns → ${esc(r.dns_target)}</span>`;
    case "—": return "";
    default: return `<span class="tag">dns ${esc(r.dns)}</span>`;
  }
}

function roleTag(r) {
  if (r.role === "primary") return r.active ? "" : `<span class="tag">primary (not active)</span>`;
  if (r.role === "standby") return r.active ? `<span class="tag warn">standby · ACTIVE</span>` : `<span class="tag">standby</span>`;
  return `<span class="tag warn">not in fleet</span>`;
}

function render() {
  const s = state;
  $("#meta").textContent = `seen from ${s.machine} · fleet serial ${s.serial}` +
    (s.updated_by ? ` · last changed by ${s.updated_by} at ${s.updated_at}` : "") + ` · v${s.version}`;

  const standbyRoutes = new Map();
  s.tunnels.forEach(t => t.routes.forEach(r => { if (r.role === "standby") standbyRoutes.set(r.host, r); }));

  const findings = s.plan.findings;
  const actions = s.plan.actions;
  let html = "";

  html += `<h2>Needs attention</h2><div class="card">`;
  html += findings.length ? findings.map(f => `
    <div class="finding">
      <span class="lvl-${f.level}">${f.level === "error" ? "✗" : f.level === "warn" ? "⚠" : "·"}</span>
      <div><b>${esc(f.subject)}</b> — ${esc(f.message)}</div>
      ${f.fix ? `<div class="fix">${esc(f.fix)}</div>` : ""}
    </div>`).join("") : `<div class="mute">Nothing. Every tunnel is up and matches the fleet file.</div>`;
  if (s.errors.length) html += s.errors.map(e => `<div class="finding"><span class="lvl-error">!</span><div class="mute">${esc(e)}</div></div>`).join("");
  html += `</div>`;

  html += `<h2>Differences from the fleet file</h2><div class="card">`;
  if (!actions.length) html += `<div class="mute">None — Cloudflare and this Mac match the fleet file.</div>`;
  else {
    html += actions.map(a => {
      const tags = [a.scope === "local" ? "this Mac" : "cloudflare"];
      if (a.owner) tags.push("owner " + a.owner);
      if (a.prune) tags.push("prune");
      if (a.guarded && !a.destroy) tags.push("takeover");
      if (a.destroy) tags.push("destroy");
      return `<div class="action"><span class="mono">${esc(symbol(a))}</span><div>${esc(a.summary)}</div>
        <div>${tags.map(t => `<span class="tag ${t === "takeover" || t === "destroy" ? "bad" : t === "prune" ? "warn" : ""}">${esc(t)}</span>`).join(" ")}</div></div>`;
    }).join("");
    const nPrune = actions.filter(a => a.prune).length, nGuard = actions.filter(a => a.guarded && !a.destroy).length;
    if (me.admin) html += `<div class="toolbar">
      <button class="primary" data-apply='{}'>Apply safe changes</button>
      ${nPrune ? `<button data-apply='{"prune":true}' data-confirm="Also remove ${nPrune} thing(s) the fleet file does not mention?">…and prune (${nPrune})</button>` : ""}
      ${nGuard ? `<button class="danger" data-apply='{"prune":false,"yes":true}' data-confirm="Take ${nGuard} hostname(s) from tunnels that are serving them right now?">…and take over (${nGuard})</button>` : ""}
    </div>`;
  }
  html += `</div>`;

  const accounts = [...new Set(s.tunnels.map(t => t.account))].sort();
  for (const acct of accounts) {
    html += `<h2>${esc(acct)}</h2>`;
    for (const t of s.tunnels.filter(t => t.account === acct)) {
      const name = t.alias || t.cf_name;
      html += `<div class="card">
        <div class="row">
          <i class="dot ${esc(t.state)}"></i>
          <span class="alias">${esc(name)}</span>
          ${t.in_fleet ? "" : `<span class="tag bad">not in fleet · tokens still work</span>`}
          <span class="mute">${t.machine ? "on " + esc(t.machine) : "no fleet machine"}</span>
          <span class="mono mute">${esc(t.id)}</span>
          ${t.alias && t.cf_name && t.cf_name !== t.alias ? `<span class="mute">Cloudflare: ${esc(t.cf_name)}</span>` : ""}
          <span class="spacer" style="flex:1"></span>
          <span class="mute">${t.state === "up" ? `${t.connectors}× ${esc(t.colos.join(", "))}` : esc(t.state)}${t.versions.length ? ` · cloudflared ${esc(t.versions.join(", "))}` : ""}</span>
          ${t.machine && t.alias ? `<button data-mlogs="${esc(t.machine)}|${esc(t.alias)}">logs</button>` : ""}
          ${t.machine && t.alias && me.admin ? `<button data-relay="${esc(t.machine)}|tunnel-restart|${esc(t.alias)}">restart</button>` : ""}
        </div>
        ${t.note ? `<div class="mute" style="margin-top:4px">${esc(t.note)}</div>` : ""}
        ${t.routes.length ? `<table>${t.routes.map(r => {
          const sb = r.role === "primary" ? standbyRoutes.get(r.host) : null;
          const btn = !me.admin ? ""
                    : r.role === "primary" && sb && r.active ? `<button data-promote="${esc(r.host)}">promote standby</button>`
                    : r.role === "standby" && r.active ? `<button data-failback="${esc(r.host)}">fail back</button>` : "";
          return `<tr>
            <td><a href="https://${esc(r.host)}" target="_blank" rel="noopener">${esc(r.host)}</a></td>
            <td class="mono">${esc(r.service)}</td>
            <td>${roleTag(r)} ${dnsTag(r)} ${r.failover ? `<span class="tag">failover ${esc(r.failover)}</span>` : ""}</td>
            <td style="text-align:right">${btn}</td></tr>`;
        }).join("")}</table>` : `<div class="mute" style="margin-top:6px">no routes</div>`}
      </div>`;
    }
  }

  html += `<h2>Machines</h2><div class="card" id="machines">${s.machines.map(([n, h]) =>
    `<div class="action"><span class="mono">·</span><div><b>${esc(n)}</b> <span class="mute">${esc(h)}</span> <span class="mute" data-health="${esc(n)}"></span></div>
     <div>${me.admin ? `<button data-relay="${esc(n)}|agent-pass|">agent pass</button>` : ""}</div></div>`).join("")}</div>`;
  if (me.admin) {
    html += `<h2>Tokens</h2><div class="card">
      <div class="row" id="tokmachines">${s.machines.map(([n]) => `<button data-tokm="${esc(n)}"${n === tokMachine ? ' class="primary"' : ""}>${esc(n)}</button>`).join(" ")}</div>
      <div id="tokbody" style="margin-top:10px"><div class="mute">Pick a machine.</div></div></div>`;
  }
  html += `<h2>Cloudflare changes <span class="mute" style="text-transform:none;letter-spacing:0">(tunnels cf, every machine)</span></h2>
    <div class="card"><div class="events" id="cflog"><div class="mute">loading…</div></div></div>`;
  html += `<h2>Agent</h2><div class="card"><div class="mute" id="agent-meta"></div><div class="events" id="events" style="margin-top:8px"></div>
    <div class="toolbar"><button data-logs="agent">agent log</button></div></div>`;
  html += `<div class="card" id="logbox" style="display:none"><div class="row"><b id="logtitle"></b><span style="flex:1"></span><button id="logclose">close</button></div><pre id="logtext"></pre></div>`;
  html += `<h2>Fleet file</h2><div class="card"><details><summary>serial ${s.serial} — edit with <span class="mono">tunnels fleet edit</span></summary><pre id="fleettext">…</pre></details></div>`;
  $("#app").innerHTML = html;
  fetch("/api/fleet").then(r => r.text()).then(t => { const el = $("#fleettext"); if (el) el.textContent = t; });
}

async function loadTokens(machine) {
  tokMachine = machine;
  history.replaceState(null, "", "#tokens=" + encodeURIComponent(machine));
  document.querySelectorAll("[data-tokm]").forEach(b => b.className = b.dataset.tokm === machine ? "primary" : "");
  const el = $("#tokbody"); if (!el) return;
  el.innerHTML = `<div class="mute">asking ${esc(machine)}… (checking every token with Cloudflare takes a few seconds)</div>`;
  let v;
  try {
    const r = await fetch("/api/mesh-tokens?machine=" + encodeURIComponent(machine));
    v = await r.json(); if (!r.ok) throw new Error(v.error || r.statusText);
  } catch (e) { el.innerHTML = `<div class="lvl-error">${esc(e.message)}</div>`; return; }
  const yes = (x, good, bad, unknown) => x === true ? `<span class="tag good">${good}</span>` : x === false ? `<span class="tag bad">${bad}</span>` : `<span class="tag">${unknown}</span>`;
  const apiRow = (t, acct) => {
    const others = t.reach.filter(r => r.account_id !== acct).map(r => r.account_name);
    return `<tr><td class="mono">${esc(t.hint)} <span class="mute">${esc(t.id)}</span></td>
      <td><span class="mute">API token</span>${others.length ? ` <span class="tag">also reaches ${esc(others.join(", "))}</span>` : ""}</td>
      <td>${yes(t.valid, "works", "rejected by Cloudflare", "?")}</td>
      <td style="text-align:right"><button data-tokrm="${esc(t.id)}" class="danger">remove</button></td></tr>`;
  };
  const conRow = c => `<tr><td><b>${esc(c.alias || c.name)}</b> <span class="mute">${esc(c.name)} · ${esc((c.tunnel_id || "").slice(0, 8))}</span></td>
      <td><span class="mute">tunnel token</span> · ${esc(c.state)} · ${c.token_file ? "token file" : `<span class="tag warn">token in plist</span>`}${c.runs_elsewhere ? ` <span class="tag warn">fleet runs it on ${esc(c.runs_elsewhere)}</span>` : ""}</td>
      <td>${yes(c.current, "current", "stale — rotated elsewhere", "can't check here")}</td>
      <td style="text-align:right"><button data-conrefetch="${esc(c.alias || c.name)}">re-fetch</button> <button class="danger" data-conrotate="${esc(c.alias || c.name)}">rotate</button></td></tr>`;
  let h = `<div class="mute" style="margin-bottom:10px">On ${esc(machine)}, by Cloudflare account: the API tokens that let this machine manage the account, and the tunnels it runs in it. Tokens are shown by a hint and never shown again once added.</div>`;
  for (const g of v.accounts) {
    h += `<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px">
      <div class="row"><b>${esc(g.alias || g.name || g.account_id.slice(0, 8))}</b>
        <span class="mute">${esc(g.name)} · ${esc(g.zones.join(", ") || "no zones")}</span>
        <span style="flex:1"></span>
        ${g.manageable ? `<span class="tag good">managed from here</span>` : `<span class="tag warn">no working API token here — its tunnels can't be checked or re-fetched from ${esc(machine)}</span>`}</div>
      <table>${g.api_tokens.map(t => apiRow(t, g.account_id)).join("")}${g.connectors.map(conRow).join("")}
        ${!g.api_tokens.length && !g.connectors.length ? `<tr><td class="mute">nothing</td></tr>` : ""}</table></div>`;
  }
  if (v.unplaced.length) {
    h += `<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px"><div class="row"><b>API tokens that reach no account</b>
      <span class="mute">rejected by Cloudflare, or never labelled — re-check, or remove</span></div>
      <table>${v.unplaced.map(t => apiRow(t, "")).join("")}</table></div>`;
  }
  if (!v.accounts.length && !v.unplaced.length) h += `<div class="mute">no tokens on ${esc(machine)}</div>`;
  h += `<div class="toolbar"><input id="toknew" type="password" placeholder="paste a Cloudflare API token — it lands under the account(s) it reaches" autocomplete="off" style="flex:1;min-width:260px;font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
      <button class="primary" data-tokadd="1">add to ${esc(machine)}</button><button data-tokrefresh="1">re-check all</button></div>`;
  el.innerHTML = h;
}

async function tokenAction(action, tunnel, arg, doneMsg) {
  try { const r = await post("/api/relay", { machine: tokMachine, action, tunnel: tunnel || "", arg: arg || "" }); toast("✓ " + (r.message || doneMsg), 7000); }
  catch (err) { toast("✗ " + err.message, 9000); }
  loadTokens(tokMachine);
}

function symbol(a) {
  if (a.destroy) return "!";
  if (["add-ingress", "create-dns", "start-local", "load-local"].includes(a.op)) return "+";
  if (["update-ingress", "repoint-dns", "restart-local"].includes(a.op)) return "~";
  return "−";
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "refresh") return load(true);
  if (b.id === "logclose") { $("#logbox").style.display = "none"; return; }
  if (b.dataset.tokm) return loadTokens(b.dataset.tokm);
  if (b.dataset.tokadd) {
    const t = $("#toknew").value.trim(); if (!t) return toast("paste a token first");
    b.disabled = true; $("#toknew").value = "";
    return tokenAction("token-add", "", t);
  }
  if (b.dataset.tokrefresh) return tokenAction("token-refresh");
  if (b.dataset.tokrm) {
    if (!confirm(`Forget API token ${b.dataset.tokrm} on ${tokMachine}? It keeps working in Cloudflare until you revoke it there.`)) return;
    return tokenAction("token-rm", "", b.dataset.tokrm);
  }
  if (b.dataset.conrefetch) return tokenAction("connector-refetch", b.dataset.conrefetch);
  if (b.dataset.conrotate) {
    const name = b.dataset.conrotate;
    const typed = prompt(`Rotate ${name}: Cloudflare issues a new secret and EVERY old connector token for it stops working. ${tokMachine} takes the new one now; any other machine running it fetches it on its next agent pass.\n\nType the tunnel's name to rotate it:`);
    if (typed !== name) return typed === null ? undefined : toast("not rotated — the name did not match");
    return tokenAction("tunnel-rotate", name);
  }
  if (b.dataset.mlogs) {
    const [machine, tunnel] = b.dataset.mlogs.split("|");
    const t = await (await fetch(`/api/mesh-logs?machine=${encodeURIComponent(machine)}&tunnel=${encodeURIComponent(tunnel)}`)).text();
    $("#logtitle").textContent = `logs: ${tunnel} on ${machine}`;
    $("#logtext").textContent = t || "(empty)";
    $("#logbox").style.display = "block"; $("#logbox").scrollIntoView({ behavior: "smooth" });
    return;
  }
  if (b.dataset.relay) {
    const [machine, action, tunnel] = b.dataset.relay.split("|");
    const what = action === "agent-pass" ? `run an agent pass on ${machine}` : `restart ${tunnel} on ${machine}`;
    if (!confirm(`${what[0].toUpperCase()}${what.slice(1)}?`)) return;
    b.disabled = true;
    try { const r = await post("/api/relay", { machine, action, tunnel }); toast("✓ " + r.message); }
    catch (err) { toast("✗ " + err.message, 8000); }
    b.disabled = false; setTimeout(() => load(true), 4000);
    return;
  }
  if (b.dataset.logs) {
    const name = b.dataset.logs;
    const t = await (await fetch("/api/logs?tunnel=" + encodeURIComponent(name))).text();
    $("#logtitle").textContent = name === "agent" ? "agent log" : `logs: ${name}`;
    $("#logtext").textContent = t || "(empty)";
    $("#logbox").style.display = "block"; $("#logbox").scrollIntoView({ behavior: "smooth" });
    return;
  }
  try {
    if (b.dataset.apply) {
      if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
      b.disabled = true; toast("applying…", 60000);
      const r = await post("/api/apply", JSON.parse(b.dataset.apply));
      toast(reportText(r), 9000); load(true);
    } else if (b.dataset.promote) {
      if (!confirm(`Send ${b.dataset.promote} to its standby now?`)) return;
      b.disabled = true; const r = await post("/api/promote", { host: b.dataset.promote });
      toast(reportText(r), 9000); load(true);
    } else if (b.dataset.failback) {
      if (!confirm(`Send ${b.dataset.failback} back to its primary now?`)) return;
      b.disabled = true; const r = await post("/api/failback", { host: b.dataset.failback });
      toast(reportText(r), 9000); load(true);
    }
  } catch (err) { toast("✗ " + err.message, 8000); b.disabled = false; }
});

whoami().then(() => load(false)).then(() => {
  // #tokens=<machine> opens that machine's tokens, for links and bookmarks
  const m = (location.hash.match(/^#tokens=(.+)$/) || [])[1];
  if (m && me.admin) { loadTokens(decodeURIComponent(m)); setTimeout(() => $("#tokbody") && $("#tokbody").scrollIntoView(), 300); }
});
setInterval(() => { loadAgent(); loadPeers(); }, 15000);
setInterval(() => load(false), 60000);
</script>
</body>
</html>

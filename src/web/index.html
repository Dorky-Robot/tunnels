<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tunnels</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --ink: #1d1d1b; --mute: #6b6b66; --line: #e4e3de;
    --up: #1f8f4e; --down: #c2412d; --warn: #b7791f; --info: #52627a; --accent: #2f5bd3;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1e1e1c; --ink: #ecebe6; --mute: #9a9993; --line: #33332f;
            --up: #3fbf74; --down: #ec6a55; --warn: #e0a642; --info: #8fa3c2; --accent: #7d9cf0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: baseline; padding: 16px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  header .meta { color: var(--mute); font-size: 13px; }
  header .spacer { flex: 1; }
  main { padding: 16px 24px 48px; max-width: 1200px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 28px 0 10px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; transform: translateY(-1px); }
  .up { background: var(--up); } .down { background: var(--down); } .unknown, .missing { background: var(--mute); }
  .alias { font-weight: 600; font-size: 15px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .mute { color: var(--mute); }
  .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
  .tag.bad { color: var(--down); border-color: var(--down); }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .tag.good { color: var(--up); border-color: var(--up); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  td { padding: 5px 8px 5px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
  td:first-child { width: 38%; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--down); border-color: var(--down); }
  button:disabled { opacity: .5; cursor: default; }
  .finding { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .finding:first-child { border-top: 0; }
  .finding .fix { grid-column: 2; font-family: var(--mono); font-size: 12px; color: var(--mute); }
  .lvl-error { color: var(--down); } .lvl-warn { color: var(--warn); } .lvl-info { color: var(--info); }
  .action { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .action:first-child { border-top: 0; }
  .events { font-family: var(--mono); font-size: 12px; max-height: 260px; overflow: auto; }
  .events div { padding: 2px 0; white-space: pre-wrap; }
  pre { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 10px; border-radius: 6px; overflow: auto; max-height: 420px; margin: 8px 0 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .peers { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .peers span { display: inline-flex; gap: 5px; align-items: center; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; max-width: 90vw; white-space: pre-wrap; z-index: 5; }
  .loading { color: var(--mute); padding: 40px 0; text-align: center; }
  details summary { cursor: pointer; color: var(--mute); }
  .askbox { border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin: 6px 0; background: var(--bg); }
  .askbox.danger { border-color: var(--down); }
  .askbox .toolbar { margin-top: 8px; }
  .askbox input:not([type=checkbox]) { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-width: 220px; margin-top: 8px; }
  .askbox label { display: inline-flex; align-items: center; gap: 4px; margin-right: 14px; white-space: nowrap; }
  .askresult { margin-top: 6px; white-space: pre-wrap; font-size: 13px; }

  /* machine view — a type scale per level (machine > account > tunnel > subdomain) and an 8px
     spacing grid; NN/g visual hierarchy, Carbon 2x grid */
  .mcard { padding: 0; }
  .mcard > summary { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 16px; cursor: pointer; color: var(--ink); }
  .mcard > summary::-webkit-details-marker { display: none; }
  .mcard[open] > summary { border-bottom: 1px solid var(--line); }
  .mbody { padding: 0 16px 16px; }
  .chev { color: var(--mute); transition: transform .15s; display: inline-block; width: 12px; }
  details[open] > summary .chev { transform: rotate(90deg); }
  .mname { font-size: 18px; font-weight: 700; }
  .msum { color: var(--mute); font-size: 13px; }
  .acct { margin-top: 24px; }
  .acct-h { display: flex; gap: 8px; align-items: baseline; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .acct-h .acct-name { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .tun { margin-top: 16px; }
  .tun-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .tname { font-weight: 600; font-size: 15px; }
  .tun-acts { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  .routes { table-layout: fixed; margin-top: 8px; }
  .routes td { padding: 8px 8px 8px 0; }
  .routes td:first-child { width: auto; }
  .routes .svc { color: var(--mute); }
  /* status: icon + text + color, never color alone (Carbon status indicators) */
  .status { display: inline-flex; gap: 4px; align-items: baseline; font-size: 13px; white-space: nowrap; }
  .status.ok { color: var(--up); } .status.bad { color: var(--down); } .status.warn { color: var(--warn); } .status.info { color: var(--mute); }
  /* quiet buttons for routine actions; one visible emphasis level per row (Material 3, Atlassian) */
  button.text { border-color: transparent; background: transparent; color: var(--accent); padding: 4px 8px; }
  button.text:hover { border-color: var(--line); }
  /* security actions kept apart from routine ones (NN/g proximity of consequential options, Primer danger zone) */
  .dz { margin-top: 24px; border: 1px solid var(--line); border-radius: 8px; }
  .dz > summary { list-style: none; padding: 8px 12px; color: var(--mute); font-size: 13px; }
  .dz > summary::-webkit-details-marker { display: none; }
  .dz-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
  .dz-row .grow { flex: 1; min-width: 220px; }
  time { white-space: nowrap; }
  /* touch: 44pt targets (Apple HIG), 8dp apart (Material) */
  @media (pointer: coarse) { button { min-height: 44px; padding: 8px 14px; } .tun-h, .toolbar, .dz-row { gap: 8px; } }
  @media (max-width: 700px) {
    header { position: static; padding: 12px; gap: 8px 12px; }
    main { padding: 8px 12px 48px; }
    .mcard > summary, .mbody { padding-left: 12px; padding-right: 12px; }
    .routes { table-layout: auto; } .routes col { width: auto !important; } .routes .svc { display: none; }
    .routes td:first-child { word-break: break-word; }
    .tun-acts { width: 100%; margin-left: -8px; }
  }
</style>
</head>
<body>
<header>
  <h1>tunnels</h1>
  <span class="meta" id="meta">loading…</span>
  <span class="spacer"></span>
  <span class="tag" id="whoami"></span>
  <div class="peers" id="peers"></div>
  <button id="refresh">Refresh</button>
</header>
<main>
  <div id="app"><div class="loading">Looking at Cloudflare and this Mac…</div></div>
</main>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let state = null;
let me = { who: "tailnet", admin: true, via_cloudflare: false };
let redrawPending = false;

function toast(msg, ms = 4000) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", ms);
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Tunnels": "1" }, body: JSON.stringify(body || {}) });
  const v = await r.json();
  if (!r.ok) throw new Error(v.error || r.statusText);
  return v;
}

function reportText(r) {
  const lines = (r.done || []).map(o => `${o.ok ? "✓" : "✗"} ${o.summary} — ${o.detail}`);
  (r.held || []).forEach(([s, why]) => lines.push(`· held: ${s} (${why})`));
  return lines.join("\n") || "nothing to do";
}

async function whoami() {
  try { me = await (await fetch("/api/whoami")).json(); } catch { }
  const el = $("#whoami");
  el.innerHTML = me.via_cloudflare
    ? `${esc(me.who)} · ${me.admin ? "admin" : "can look, not change"} · <a href="/auth/logout">sign out</a>`
    : "on the tailnet · admin";
  el.className = "tag " + (me.admin ? "good" : "");
}

async function load(fresh) {
  $("#refresh").disabled = true;
  try {
    const r = await fetch("/api/status" + (fresh ? "?fresh=1" : ""));
    const v = await r.json();
    if (!r.ok) throw new Error(v.error || r.statusText);
    state = v; render();
  } catch (e) {
    $("#app").innerHTML = `<div class="card lvl-error">${esc(e.message)}</div>`;
  } finally { $("#refresh").disabled = false; }
  loadAgent(); loadPeers(); loadCfLog(); if (me.admin && !accounts.length) loadAccounts();
}

async function loadAgent() {
  try {
    const v = await (await fetch("/api/agent")).json();
    const el = $("#events"); if (!el) return;
    const tick = v.last_tick;
    $("#agent-meta").innerHTML = `agent v${esc(v.version)} on ${esc(v.machine)} · running since ${ago(v.started_at)}` +
      (tick ? ` · last sync ${ago(tick.at)} (${tick.took_ms} ms)` : "") + (tick && tick.error ? ` · ${st("bad", tick.error)}` : "");
    el.innerHTML = (v.events || []).map(e => `<div><span class="mute">${ago(e.at)}</span> ${esc(e.kind.padEnd(8))} ${esc(e.message)}</div>`).join("")
      || `<div class="mute">nothing yet — the agent has had nothing to fix</div>`;
  } catch { }
}

async function loadCfLog() {
  try {
    const v = await (await fetch("/api/cf-log?all=1")).json();
    const el = $("#cflog"); if (!el) return;
    el.innerHTML = v.length ? v.map(r => `<div><span class="mute">${ago(r.at)}</span> ${r.ok ? "✓" : "✗"} ${esc(r.machine)} ${esc(r.method)} ${esc(r.path)}` +
      `${r.undoes ? ` <span class="tag">undid ${esc(r.undoes)}</span>` : ""}${!r.ok ? ` <span class="tag">failed; nothing changed</span>` : r.undo ? "" : ` <span class="tag warn">not undoable</span>`} <span class="mute">${esc(r.id)}</span></div>`).join("")
      : `<div class="mute">No changes through <span class="mono">tunnels cf</span> yet.</div>`;
  } catch { }
}

async function loadPeers() {
  try {
    const v = await (await fetch("/api/peers")).json();
    v.forEach(p => { const el = document.querySelector(`[data-health="${CSS.escape(p.machine)}"]`);
      if (el) el.innerHTML = p.health ? `v${esc(p.health.version)} · synced ${ago(p.health.last_tick && p.health.last_tick.at)}` : st("bad", "not answering"); });
    $("#peers").innerHTML = v.map(p => {
      const h = p.health; const ok = !!h;
      const title = ok ? `v${h.version} · fleet serial ${h.serial ?? "—"}` : "not answering";
      return `<span title="${esc(title)}"><i class="dot ${ok ? "up" : "down"}"></i>${esc(p.machine)}${ok && state && h.serial !== state.serial ? ` <span class="tag warn">serial ${esc(h.serial)}</span>` : ""}</span>`;
    }).join("");
  } catch { }
}

/// "4 min ago", with the exact time on hover (Cloudscape timestamps).
function ago(iso) {
  if (!iso) return "—";
  const t = Date.parse(iso); if (isNaN(t)) return esc(iso);
  const s = Math.max(0, (Date.now() - t) / 1000);
  const txt = s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`;
  return `<time datetime="${esc(iso)}" title="${esc(new Date(t).toLocaleString())}">${txt}</time>`;
}

/// A status as icon + text + color (never color alone).
function st(kind, text, title) {
  const icon = { ok: "✓", bad: "✗", warn: "▲", info: "·" }[kind] || "·";
  return `<span class="status ${kind}"${title ? ` title="${esc(title)}"` : ""}>${icon} ${esc(text)}</span>`;
}

/// Only what needs attention: a working DNS record says nothing.
function dnsTag(r) {
  switch (r.dns) {
    case "missing": return st("bad", "no DNS record");
    case "elsewhere": return st("warn", `DNS points to ${r.dns_target}`);
    default: return "";
  }
}

function roleTag(r) {
  if (r.role === "primary") return r.active ? "" : st("info", "traffic on standby");
  if (r.role === "standby") return r.active ? st("warn", "serving from here (standby)") : `<span class="mute">standby</span>`;
  return st("warn", "not in the fleet file");
}

function render() {
  const s = state;
  $("#meta").innerHTML = `seen from ${esc(s.machine)} · fleet serial ${s.serial}` +
    (s.updated_by ? ` · changed ${ago(s.updated_at)} by ${esc(s.updated_by)}` : "") + ` · v${esc(s.version)}`;

  const standbyRoutes = new Map();
  s.tunnels.forEach(t => t.routes.forEach(r => { if (r.role === "standby") standbyRoutes.set(r.host, r); }));

  const findings = s.plan.findings;
  const actions = s.plan.actions;
  let html = "";

  html += `<h2>Needs attention</h2><div class="card">`;
  html += findings.length ? findings.map(f => `
    <div class="finding">
      <span class="lvl-${f.level}">${f.level === "error" ? "✗" : f.level === "warn" ? "⚠" : "·"}</span>
      <div><b>${esc(f.subject)}</b> — ${esc(f.message)}</div>
      ${f.fix ? `<div class="fix">${esc(f.fix)}</div>` : ""}
    </div>`).join("") : `<div class="mute">Nothing. Every tunnel is up and matches the fleet file.</div>`;
  if (s.errors.length) html += s.errors.map(e => `<div class="finding"><span class="lvl-error">!</span><div class="mute">${esc(e)}</div></div>`).join("");
  html += `</div>`;

  html += `<h2>Differences from the fleet file</h2><div class="card">`;
  if (!actions.length) html += `<div class="mute">None — Cloudflare and this Mac match the fleet file.</div>`;
  else {
    html += actions.map(a => {
      const tags = [a.scope === "local" ? "this Mac" : "cloudflare"];
      if (a.owner) tags.push("owner " + a.owner);
      if (a.prune) tags.push("prune");
      if (a.guarded && !a.destroy) tags.push("takeover");
      if (a.destroy) tags.push("destroy");
      return `<div class="action"><span class="mono">${esc(symbol(a))}</span><div>${esc(a.summary)}</div>
        <div>${tags.map(t => `<span class="tag ${t === "takeover" || t === "destroy" ? "bad" : t === "prune" ? "warn" : ""}">${esc(t)}</span>`).join(" ")}</div></div>`;
    }).join("");
    const nPrune = actions.filter(a => a.prune).length, nGuard = actions.filter(a => a.guarded && !a.destroy).length;
    if (me.admin) html += `<div class="toolbar">
      <button class="primary" data-apply='{}'>Apply safe changes</button>
      ${nPrune ? `<button data-apply='{"prune":true}' data-confirm="Also remove ${nPrune} thing(s) the fleet file does not mention?">…and prune (${nPrune})</button>` : ""}
      ${nGuard ? `<button class="danger" data-apply='{"prune":false,"yes":true}' data-confirm="Take ${nGuard} hostname(s) from tunnels that are serving them right now?">…and take over (${nGuard})</button>` : ""}
    </div>`;
  }
  html += `</div>`;

  html += `<div class="row" style="align-items:center;margin:28px 0 10px"><h2 style="margin:0">Machines</h2><span style="flex:1"></span>
    <button class="text" data-mall="open">Expand all</button><button class="text" data-mall="close">Collapse all</button></div>
    <div id="machinecards">${renderMachines()}</div>`;
  const known = new Set(s.machines.map(([n]) => n));
  const loose = s.tunnels.filter(t => !t.machine || !known.has(t.machine));
  if (loose.length) {
    html += `<h2>Not run by any fleet machine</h2>` + loose.map(t => `<div class="card">${tunnelBlock(t, null, null, false)}</div>`).join("");
  }
  html += `<h2>Cloudflare changes <span class="mute" style="text-transform:none;letter-spacing:0">(tunnels cf, every machine)</span></h2>
    <div class="card"><div class="events" id="cflog"><div class="mute">loading…</div></div></div>`;
  html += `<h2>Agent</h2><div class="card"><div class="mute" id="agent-meta"></div><div class="events" id="events" style="margin-top:8px"></div>
    <div class="toolbar"><button data-logs="agent">agent log</button></div></div>`;
  html += `<div class="card" id="logbox" style="display:none"><div class="row"><b id="logtitle"></b><span style="flex:1"></span><button id="logclose">close</button></div><pre id="logtext"></pre></div>`;
  html += `<h2>Fleet file</h2><div class="card"><details><summary>serial ${s.serial} — edit with <span class="mono">tunnels fleet edit</span></summary><pre id="fleettext">…</pre></details></div>`;
  $("#app").innerHTML = html;
  fetch("/api/fleet").then(r => r.text()).then(t => { const el = $("#fleettext"); if (el) el.textContent = t; });
}

/// A confirmation on the page, right under the button that asked for it —
/// never a browser dialog. `type` makes the person type a name first; `go`
/// does the work and returns what to say; the answer stays in the panel.
function ask(b, { text, type, danger, label, go, after, fields, valid }) {
  document.querySelectorAll(".ask").forEach(x => x.remove());
  const tr = b.closest("tr");
  const box = document.createElement(tr ? "tr" : "div");
  box.className = "ask";
  const inner = `<div class="askbox${danger ? " danger" : ""}"><div>${text}</div>${fields || ""}
    ${type ? `<input class="asktype" placeholder="type ${esc(type)} to confirm" autocomplete="off" spellcheck="false">` : ""}
    <div class="toolbar"><button class="${danger ? "danger" : "primary"} askgo"${type || valid ? " disabled" : ""}>${esc(label || "confirm")}</button><button class="askno">cancel</button></div>
    <div class="askresult"></div></div>`;
  if (tr) { box.innerHTML = `<td colspan="9">${inner}</td>`; tr.after(box); }
  else { box.innerHTML = inner; (b.closest(".toolbar, .action, .row") || b.parentElement).after(box); }
  const goBtn = box.querySelector(".askgo"), input = box.querySelector(".asktype"), out = box.querySelector(".askresult");
  const check = () => { goBtn.disabled = (input && input.value.trim() !== type) || (valid && !valid(box)); };
  box.addEventListener("input", check); box.addEventListener("change", check);
  (box.querySelector("input:not([type=checkbox])") || input || goBtn).focus();
  box.querySelector(".askno").addEventListener("click", ev => {
    ev.stopPropagation(); box.remove();
    if (redrawPending && !asking()) { redrawPending = false; const el = $("#machinecards"); if (el) el.innerHTML = renderMachines(); }
  });
  goBtn.addEventListener("click", async ev => {
    ev.stopPropagation();
    goBtn.disabled = true; box.querySelector(".askno").disabled = true; if (input) input.disabled = true;
    out.className = "askresult mute"; out.textContent = "working…";
    try {
      const msg = await go(box);
      out.className = "askresult"; out.innerHTML = `<span class="lvl-info">✓</span> ${esc(msg)}`;
      box.querySelector(".askno").textContent = "close"; box.querySelector(".askno").disabled = false;
      if (after) setTimeout(after, 1500);
    } catch (err) {
      out.className = "askresult lvl-error"; out.textContent = "✗ " + err.message;
      box.querySelector(".askno").disabled = false; if (input) input.disabled = false; check();
    }
  });
}

async function relayMsg(machine, action, tunnel, arg) {
  const r = await post("/api/relay", { machine, action, tunnel: tunnel || "", arg: arg || "" });
  return r.message || "done";
}

/// Hostnames a tunnel is serving right now, for saying what a restart touches.
function servedBy(alias) {
  const t = state && state.tunnels.find(x => x.alias === alias);
  return t ? t.routes.filter(r => r.active).map(r => r.host) : [];
}

let accounts = [];
let accountsError = "";

// Which API tokens each machine holds, and whether its tunnel tokens are
// current, takes a few seconds to find out (every machine is asked, every
// token checked with Cloudflare). The machine cards draw at once from the
// status and fill this in when it arrives; it is kept and redrawn from,
// and fetched again only on first load, after a change, or on "re-check tokens".
async function loadAccounts() {
  try {
    const r = await fetch("/api/accounts"); const v = await r.json();
    if (!r.ok) throw new Error(v.error || r.statusText);
    accounts = v; accountsError = "";
  } catch (e) { accountsError = e.message; }
  const el = $("#machinecards"); if (!el) return;
  if (asking()) { redrawPending = true; return; }   // drawn when the open panel closes
  el.innerHTML = renderMachines();
}

const curTag = x => x === true ? `<span class="tag good">current</span>` : x === false ? `<span class="tag bad">stale</span>` : "";

/// One tunnel: its state and its routine actions, then every subdomain it
/// serves. Token rotation lives in the machine's "Tokens & rotation" section.
function tunnelBlock(t, m, acct, admin) {
  const name = t.alias || t.cf_name;
  const held = acct && m ? acct.tunnels.find(([h, c]) => h === m && c.alias === t.alias) : null;
  const standby = new Set(); state.tunnels.forEach(x => x.routes.forEach(r => { if (r.role === "standby") standby.add(r.host); }));
  const canFailOver = t.routes.filter(r => r.role === "primary" && r.active && standby.has(r.host));
  const canFailBack = t.routes.filter(r => r.role === "standby" && r.active);
  const health = t.state === "up" ? st("ok", `Up · ${t.connectors} connection${t.connectors === 1 ? "" : "s"}`, t.colos.join(", ") + (t.versions.length ? ` · cloudflared ${t.versions.join(", ")}` : ""))
    : t.state === "down" ? st("bad", "Down — no connections") : st("warn", t.state === "missing" ? "Missing in Cloudflare" : "Unknown");
  const btns = !m || !t.alias ? "" : `<span class="tun-acts">
    <button class="text" data-mlogs="${esc(m)}|${esc(t.alias)}">Logs</button>
    ${admin ? `<button class="text" data-relay="${esc(m)}|tunnel-restart|${esc(t.alias)}">Restart</button>` : ""}
    ${admin && canFailOver.length ? `<button class="text" data-failover="${esc(t.alias)}">Fail over to standby…</button>` : ""}
    ${admin && canFailBack.length ? `<button class="text" data-failbackt="${esc(t.alias)}">Fail back…</button>` : ""}</span>`;
  // where this tunnel's hostnames can fail over to, or which primary it stands in for
  const pairs = [...new Set(state.tunnels.filter(x => x !== t).flatMap(x => x.routes
    .filter(r => t.routes.some(q => q.host === r.host) && (canFailOver.length ? r.role === "standby" : r.role === "primary"))
    .map(() => `${x.alias || x.cf_name}${x.machine ? ` on ${x.machine}` : ""}`)))];
  const pairText = pairs.length ? `<span class="mute">${canFailOver.length || t.routes.every(r => r.role !== "standby") ? "standby" : "standby for"}: ${esc(pairs.join(", "))}</span>` : "";
  return `<div class="tun"><div class="tun-h">
      <span class="tname">${esc(name)}</span>${health}${pairText}
      ${t.in_fleet ? "" : st("warn", "not in the fleet file — its tokens still work")}
      ${held && held[1].current === false ? st("bad", "tunnel token out of date") : ""}
      ${btns}</div>
    ${t.routes.length ? `<table class="routes"><colgroup><col style="width:44%"><col style="width:26%"><col></colgroup>${t.routes.map(r => `<tr>
        <td><a href="https://${esc(r.host)}" target="_blank" rel="noopener">${esc(r.host)}</a></td>
        <td class="svc mono">${esc(r.service)}</td>
        <td>${roleTag(r)} ${dnsTag(r)}</td></tr>`).join("")}</table>` : `<div class="mute">no subdomains</div>`}
  </div>`;
}

let openMachines = null;   // names the person has open; null until the first draw decides
const openDZ = new Set();

/// What is wrong on a machine, as short phrases — what makes a card open itself.
function machineIssues(m) {
  const out = [];
  for (const t of state.tunnels.filter(t => t.machine === m)) {
    if (t.state !== "up") out.push(`${t.alias || t.cf_name} is ${t.state}`);
    const dns = t.routes.filter(r => r.active && (r.dns === "missing" || r.dns === "elsewhere")).length;
    if (dns) out.push(`${dns} DNS problem${dns > 1 ? "s" : ""}`);
  }
  for (const a of accounts) {
    a.holders.filter(([h, t]) => h === m && !t.valid).forEach(() => out.push(`${a.alias || a.name} API token rejected`));
    a.tunnels.filter(([h, c]) => h === m && c.current === false && !c.runs_elsewhere).forEach(([, c]) => out.push(`${c.alias || c.name} token out of date`));
    const runsHere = state.tunnels.some(t => t.machine === m && t.account === (a.alias || a.name));
    if (runsHere && !a.holders.some(([h, t]) => h === m && t.valid)) out.push(`no ${a.alias || a.name} API token`);
  }
  return out;
}

/// The machine's tokens, per account, with the actions that change them —
/// kept apart from the routine tunnel actions above.
function tokensSection(m, aliases, acctOf) {
  const rows = aliases.map(alias => {
    const acct = acctOf(alias); if (!acct) return "";
    const ai = accounts.indexOf(acct);
    const toks = acct.holders.filter(([h]) => h === m).map(([, t]) => t);
    const tuns = state.tunnels.filter(t => t.machine === m && t.account === alias && t.alias);
    const copies = acct.tunnels.filter(([h, c]) => h === m && c.runs_elsewhere).map(([, c]) => c);
    const tokText = toks.length ? toks.map(t => `<span class="mono">${esc(t.hint)}</span> ${t.valid ? st("ok", "works") : st("bad", "rejected by Cloudflare")}`).join(" · ") : st("info", "none on this machine");
    return `<div class="dz-row"><div class="grow"><b>${esc(alias)}</b> API token · ${tokText}</div>
        <button data-rowapi="${ai}|${esc(m)}">${toks.length ? "Rotate API token…" : "Add API token…"}</button></div>`
      + tuns.map(t => {
          const c = acct.tunnels.find(([h, x]) => h === m && x.alias === t.alias);
          const inPlist = c && !c[1].token_file;
          return `<div class="dz-row"><div class="grow"><b>${esc(t.alias)}</b> tunnel token ·
              ${c ? (c[1].current === false ? st("bad", "out of date") : c[1].current ? st("ok", "current") : st("info", "can't check here")) : st("info", "checking")}
              ${inPlist ? `<span class="mute" title="The token is written inside this tunnel's launch file; the next restart moves it to a locked token file.">· kept in the launch file</span>` : ""}</div>
            <button data-rowcon="${ai}|${esc(m)}|${esc(t.alias)}|${esc(t.id)}">Paste new tunnel token…</button>
            <button class="danger" data-rowtun="${ai}|${esc(m)}|${esc(t.alias)}">Rotate tunnel…</button></div>`;
        }).join("")
      + copies.map(c => `<div class="dz-row"><div class="grow mute">${esc(c.alias || c.name)} — a copy of its tunnel token is stored here; it runs on ${esc(c.runs_elsewhere)}</div></div>`).join("");
  }).join("");
  return `<details class="dz" data-dz="${esc(m)}"${openDZ.has(m) ? " open" : ""}><summary><span class="chev">›</span> Tokens &amp; rotation</summary>
    ${accounts.length ? rows : `<div class="dz-row mute">${accountsError ? esc(accountsError) : "checking tokens on every machine…"}</div>`}</details>`;
}

/// A card per machine, collapsed to a summary line when all is well
/// (NN/g accordions: open the ones with problems, keep the rest one line).
function renderMachines() {
  const s = state; if (!s) return "";
  const aliases = [...new Set([...accounts.map(a => a.alias || a.name), ...s.tunnels.filter(t => t.in_fleet).map(t => t.account)])].sort();
  const acctOf = alias => accounts.find(a => (a.alias || a.name) === alias) || null;
  const issuesBy = Object.fromEntries(s.machines.map(([m]) => [m, machineIssues(m)]));
  if (openMachines === null) {
    const hash = (location.hash.match(/^#(?:machine|tokens)=(.+)$/) || [])[1];
    openMachines = new Set(s.machines.map(([m]) => m).filter(m => issuesBy[m].length || (hash && decodeURIComponent(hash) === m)));
  }
  return s.machines.map(([m, host]) => {
    const tuns = s.tunnels.filter(t => t.machine === m);
    const subs = tuns.reduce((n, t) => n + t.routes.length, 0);
    const issues = issuesBy[m];
    const summary = `${tuns.length} tunnel${tuns.length === 1 ? "" : "s"} · ${subs} subdomain${subs === 1 ? "" : "s"} · ` +
      (issues.length ? st(issues.some(x => /down|rejected|out of date|missing/.test(x)) ? "bad" : "warn", issues.join(", ")) : st("ok", "all healthy"));
    const blocks = aliases.map(alias => {
      const acct = acctOf(alias);
      const here = tuns.filter(t => t.account === alias);
      if (!here.length) return "";
      return `<div class="acct"><div class="acct-h">${esc(alias)} <span class="acct-name">${esc(acct ? acct.name : "")}</span></div>
        ${here.map(t => tunnelBlock(t, m, acct, me.admin)).join("")}</div>`;
    }).join("");
    return `<details class="card mcard" id="m-${esc(m)}" data-m="${esc(m)}"${openMachines.has(m) ? " open" : ""}>
      <summary><span class="chev">›</span><span class="mname">${esc(m)}</span><span class="msum">${summary}</span>
        <span style="flex:1"></span><span class="msum" data-health="${esc(m)}"></span>
        ${me.admin ? `<button class="text" data-relay="${esc(m)}|agent-pass|">Sync now</button>` : ""}</summary>
      <div class="mbody">${blocks || `<div class="mute" style="margin-top:16px">no tunnels on this machine</div>`}
        ${me.admin ? tokensSection(m, aliases, acctOf) : ""}</div>
    </details>`;
  }).join("") + (me.admin ? `<div class="toolbar" style="margin-bottom:10px"><button class="text" data-acctreload="1">Re-check tokens</button></div>` : "");
}

/// The tunnel id inside a connector token (base64 JSON with "t"), or "".
function tokenTunnel(tok) { try { return JSON.parse(atob(tok.trim())).t || ""; } catch { return ""; } }

const lines = r => r.results.map(x => `${x.ok ? "✓" : "✗"} ${x.machine || x.tunnel}${x.tunnel && x.machine ? ` on ${x.machine}` : ""}: ${x.message}`).join("\n");

function symbol(a) {
  if (a.destroy) return "!";
  if (["add-ingress", "create-dns", "start-local", "load-local"].includes(a.op)) return "+";
  if (["update-ingress", "repoint-dns", "restart-local"].includes(a.op)) return "~";
  return "−";
}

// remember which machine cards and token sections are open, across redraws
document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.matches && d.matches("details.mcard") && openMachines) d.open ? openMachines.add(d.dataset.m) : openMachines.delete(d.dataset.m);
  if (d.matches && d.matches("details.dz")) d.open ? openDZ.add(d.dataset.dz) : openDZ.delete(d.dataset.dz);
}, true);

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.closest("summary")) {   // a button in a card's header must not fold the card, and its panel must be visible
    e.preventDefault();
    const d = b.closest("details"); if (d && !d.open) d.open = true;
  }
  if (b.id === "refresh") return load(true);
  if (b.id === "logclose") { $("#logbox").style.display = "none"; return; }
  if (b.dataset.acctreload) return loadAccounts();
  if (b.dataset.mall) {
    const open = b.dataset.mall === "open";
    document.querySelectorAll("details.mcard").forEach(d => { d.open = open; });
    openMachines = new Set(open ? state.machines.map(([m]) => m) : []);
    return;
  }
  if (b.dataset.failover || b.dataset.failbackt) {
    const alias = b.dataset.failover || b.dataset.failbackt, over = !!b.dataset.failover;
    const t = state.tunnels.find(x => x.alias === alias);
    const standby = new Set(); state.tunnels.forEach(x => x.routes.forEach(r => { if (r.role === "standby") standby.add(r.host); }));
    const hosts = over ? t.routes.filter(r => r.role === "primary" && r.active && standby.has(r.host)).map(r => r.host)
                       : t.routes.filter(r => r.role === "standby" && r.active).map(r => r.host);
    return ask(b, { danger: true, label: over ? "Fail over the ticked ones" : "Fail back the ticked ones",
      text: over ? `<b>Send traffic for these subdomains to their standby.</b> DNS moves; ${esc(alias)} keeps running.`
                 : `<b>Send traffic for these subdomains back to their primary.</b>`,
      fields: `<div style="margin-top:8px">${hosts.map(h => `<label><input type="checkbox" class="fohost" value="${esc(h)}" checked>${esc(h)}</label>`).join("")}</div>`,
      valid: box => box.querySelectorAll(".fohost:checked").length > 0,
      go: async box => {
        const out = [];
        for (const h of [...box.querySelectorAll(".fohost:checked")].map(x => x.value)) {
          try { await post(over ? "/api/promote" : "/api/failback", { host: h }); out.push(`✓ ${h}`); }
          catch (err) { out.push(`✗ ${h}: ${err.message}`); }
        }
        return out.join("\n");
      }, after: () => load(true) });
  }
  if (b.dataset.rowapi) {
    const [ai, m] = b.dataset.rowapi.split("|"); const a = accounts[+ai]; if (!a) return toast("still checking tokens — try again in a moment");
    const name = a.alias || a.name;
    const all = state ? state.machines.map(([n]) => n) : [m];
    const others = [...new Set(a.holders.map(([h]) => h))].filter(h => h !== m);
    return ask(b, { label: `put it on the ticked machines`,
      text: `<b>${a.holders.some(([h]) => h === m) ? "Rotate" : "Add"} ${esc(m)}'s ${esc(name)} API token.</b>
        In Cloudflare: My Profile → API Tokens → <i>Create Token</i> (Cloudflare Tunnel: Edit, DNS: Edit, Zone: Read for ${esc(name)}) — or <i>Roll</i> ${esc(m)}'s current one — and paste it.
        It is checked, put on each ticked machine, and the old ${esc(name)} token there is retired.${others.length ? ` Tick others to give them the same token.` : ""}`,
      fields: `<input class="acctok" type="password" placeholder="the new API token" autocomplete="off" style="width:100%;max-width:520px">
        <div style="margin-top:8px">Put it on: ${all.map(x => `<label><input type="checkbox" class="acctm" value="${esc(x)}"${x === m ? " checked" : ""}>${esc(x)}</label>`).join("")}</div>`,
      valid: box => box.querySelector(".acctok").value.trim().length > 20 && !box.querySelector(".acctok").value.trim().startsWith("eyJ") && box.querySelectorAll(".acctm:checked").length > 0,
      go: async box => {
        const token = box.querySelector(".acctok").value.trim(); box.querySelector(".acctok").value = "";
        const machines = [...box.querySelectorAll(".acctm:checked")].map(x => x.value);
        const r = await post("/api/account/rotate-api", { account_id: a.account_id, token, machines });
        const retired = r.results.flatMap(x => (x.message.match(/retired \d+ old token\(s\) here: (.*?)(;|$)/) || [, ""])[1].split(", ").filter(Boolean));
        return lines(r) + (retired.length ? `\n\nNow delete these old tokens in Cloudflare (My Profile → API Tokens): ${[...new Set(retired)].join(", ")}` : "");
      }, after: loadAccounts });
  }
  if (b.dataset.rowtun) {
    const [, m, alias] = b.dataset.rowtun.split("|"); const hosts = servedBy(alias);
    return ask(b, { danger: true, type: alias, label: `rotate ${alias}`,
      text: `<b>Rotate ${esc(alias)}</b> on ${esc(m)}: Cloudflare issues a new secret, every old token for it stops working, and ${esc(m)} takes the new one and restarts it${hosts.length ? ` — a few seconds of downtime for <b>${esc(hosts.join(", "))}</b>` : ""}.`,
      go: () => relayMsg(m, "tunnel-rotate", alias), after: loadAccounts });
  }
  if (b.dataset.rowcon) {
    const [, m, alias, tid] = b.dataset.rowcon.split("|");
    return ask(b, { label: `use it for ${alias}`,
      text: `<b>Paste ${esc(alias)}'s tunnel token</b>, refreshed in Cloudflare (Zero Trust → Networks → Tunnels → ${esc(alias)} → refresh token). It is installed on ${esc(m)} and the tunnel restarts on it.`,
      fields: `<input class="acccon" type="password" placeholder="eyJ…" autocomplete="off" style="width:100%;max-width:520px"><div class="acchint mute"></div>`,
      valid: box => {
        const t = box.querySelector(".acccon").value.trim(), got = tokenTunnel(t), h = box.querySelector(".acchint");
        h.textContent = !t ? "" : !got ? "that is not a tunnel token (they start with eyJ)" : tid && got !== tid ? `that token is for another tunnel (${got.slice(0, 8)}), not ${alias}` : "";
        return !!got && (!tid || got === tid);
      },
      go: async box => {
        const token = box.querySelector(".acccon").value.trim(); box.querySelector(".acccon").value = "";
        return lines(await post("/api/account/connector", { token }));
      }, after: loadAccounts });
  }
  if (b.dataset.mlogs) {
    const [machine, tunnel] = b.dataset.mlogs.split("|");
    const t = await (await fetch(`/api/mesh-logs?machine=${encodeURIComponent(machine)}&tunnel=${encodeURIComponent(tunnel)}`)).text();
    $("#logtitle").textContent = `logs: ${tunnel} on ${machine}`;
    $("#logtext").textContent = t || "(empty)";
    $("#logbox").style.display = "block"; $("#logbox").scrollIntoView({ behavior: "smooth" });
    return;
  }
  if (b.dataset.relay) {
    const [machine, action, tunnel] = b.dataset.relay.split("|");
    const hosts = action === "tunnel-restart" ? servedBy(tunnel) : [];
    return ask(b, {
      label: action === "agent-pass" ? `Sync ${machine} now` : `Restart ${tunnel}`,
      text: action === "agent-pass"
        ? `Sync <b>${esc(machine)}</b> now: its agent takes the newest fleet file, repairs anything that drifted, and restarts whatever is down. Normally this happens every two minutes on its own.`
        : `Restart <b>${esc(tunnel)}</b> on <b>${esc(machine)}</b>${hosts.length ? ` — a few seconds of downtime for <b>${esc(hosts.join(", "))}</b>` : ""}.`,
      go: () => relayMsg(machine, action, tunnel), after: () => { load(true); loadAccounts(); } });
  }
  if (b.dataset.logs) {
    const name = b.dataset.logs;
    const t = await (await fetch("/api/logs?tunnel=" + encodeURIComponent(name))).text();
    $("#logtitle").textContent = name === "agent" ? "agent log" : `logs: ${name}`;
    $("#logtext").textContent = t || "(empty)";
    $("#logbox").style.display = "block"; $("#logbox").scrollIntoView({ behavior: "smooth" });
    return;
  }
  if (b.dataset.apply) {
    const body = JSON.parse(b.dataset.apply);
    const go = async () => reportText(await post("/api/apply", body));
    if (!b.dataset.confirm) {
      b.disabled = true; toast("applying…", 60000);
      try { toast(await go(), 9000); } catch (err) { toast("✗ " + err.message, 8000); }
      b.disabled = false; return load(true);
    }
    return ask(b, { danger: !!body.yes, label: body.yes ? "take them over" : "prune them", text: esc(b.dataset.confirm), go, after: () => load(true) });
  }
  if (b.dataset.promote || b.dataset.failback) {
    const host = b.dataset.promote || b.dataset.failback, promote = !!b.dataset.promote;
    return ask(b, { danger: true, label: promote ? "send it to the standby" : "send it back",
      text: promote ? `Send <b>${esc(host)}</b>'s traffic to its <b>standby</b> now. DNS moves; the primary keeps running.`
                    : `Send <b>${esc(host)}</b>'s traffic back to its <b>primary</b> now.`,
      go: async () => reportText(await post(promote ? "/api/promote" : "/api/failback", { host })), after: () => load(true) });
  }
});

whoami().then(() => load(false)).then(() => {
  // #machine=<name> (or the older #tokens=<name>) scrolls to that machine
  const m = (location.hash.match(/^#(?:machine|tokens)=(.+)$/) || [])[1];
  if (m) setTimeout(() => { const el = document.getElementById("m-" + decodeURIComponent(m)); if (el) el.scrollIntoView(); }, 300);
});
// refreshes re-draw the page; hold them while a confirmation is open
const asking = () => !!document.querySelector(".ask");
setInterval(() => { if (!asking()) { loadAgent(); loadPeers(); } }, 15000);
setInterval(() => { if (!asking()) load(false); }, 60000);
</script>
</body>
</html>
